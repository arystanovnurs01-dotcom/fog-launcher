<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0713" />
    <title>404 — FogVisual</title>
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(circle at 30% 20%, rgba(139, 92, 246, 0.22), transparent 42%),
          radial-gradient(circle at 80% 80%, rgba(196, 181, 253, 0.12), transparent 38%),
          #08060f;
        color: #f4f0ff;
        font-family: "Segoe UI", system-ui, sans-serif;
      }
      main {
        width: min(100%, 560px);
        padding: 36px;
        border: 1px solid rgba(196, 181, 253, 0.18);
        border-radius: 22px;
        background: rgba(21, 16, 32, 0.86);
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.38);
      }
      p:first-child {
        margin: 0 0 10px;
        color: #c4b5fd;
        font-size: 12px;
        letter-spacing: 0.16em;
        text-transform: uppercase;
      }
      h1 { margin: 0 0 14px; font-size: clamp(2.4rem, 8vw, 4rem); line-height: 1.05; }
      p { margin: 0; color: #b9aed0; line-height: 1.65; }
      a {
        display: inline-flex;
        margin-top: 24px;
        padding: 12px 18px;
        border-radius: 12px;
        background: #8b5cf6;
        color: #fff;
        font-weight: 700;
        text-decoration: none;
      }
      a:hover { background: #7c4de8; }
    </style>
  </head>
  <body>
    <main>
      <p>FogVisual</p>
      <h1>Страница ушла в туман.</h1>
      <p>Такого адреса нет. Вернитесь на главную — там лаунчер, проекты и Fog Account.</p>
      <a href="./">Вернуться на главную</a>
    </main>
  </body>
</html>
